<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How it works: Claude talks to two MCP servers on your computer. They keep your session and caches locally and only connect to TUWEL, LectureTube and the TU Wien login, plus Groq for audio if you added a key.</title>
  <style>
    .flow { offset-rotate: 0deg; animation: flow 2.4s linear infinite; }
    .both { animation-direction: alternate; animation-duration: 1.6s; }
    .opt { animation-duration: 3.6s; opacity: 0.7; }
    @keyframes flow { 0% { offset-distance: 0%; opacity: 0; } 12%, 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; display: none; } }
  </style>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3d71"/><stop offset="0.45" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e11d74" stop-opacity="0.4"/><stop offset="1" stop-color="#e11d74" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <clipPath id="frame"><rect width="880" height="330" rx="20"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="330" fill="#0b0b12"/>
    <rect width="880" height="330" fill="url(#grid)"/>
    <ellipse cx="420" cy="0" rx="320" ry="150" fill="url(#glowA)"/>
    <ellipse cx="880" cy="330" rx="300" ry="160" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="329" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="28" y="36" font-size="12" font-weight="600" letter-spacing="1.5" fill="#d946ef">HOW IT WORKS</text>

  <!-- Claude -->
  <rect x="28" y="110" width="150" height="84" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="44" y="126" width="30" height="30" rx="9" fill="url(#accent)"/>
  <text x="59" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C</text>
  <text x="84" y="146" font-size="16" font-weight="600" fill="#fafafa">Claude</text>
  <text x="44" y="178" font-size="12" fill="#a1a1aa">Code or Desktop</text>

  <!-- your computer -->
  <rect x="222" y="58" width="330" height="236" rx="18" fill="#ffffff" fill-opacity="0.02" stroke="#d946ef" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="240" y="82" font-size="12" font-weight="600" letter-spacing="1" fill="#d946ef">YOUR COMPUTER</text>
  <rect x="240" y="96" width="140" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="256" y="122" font-size="14" font-weight="600" fill="#fafafa">tuwel</text>
  <text x="256" y="141" font-size="12" fill="#a1a1aa">27 tools</text>
  <rect x="394" y="96" width="140" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="410" y="122" font-size="14" font-weight="600" fill="#fafafa">lecturetube</text>
  <text x="410" y="141" font-size="12" fill="#a1a1aa">18 tools</text>
  <rect x="240" y="168" width="294" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="256" y="190" font-size="13" font-weight="600" fill="#e4e4e7">Session, owner-only</text>
  <text x="256" y="207" font-size="12" fill="#a1a1aa">one TU Wien login for both servers</text>
  <rect x="240" y="228" width="294" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="256" y="250" font-size="13" font-weight="600" fill="#e4e4e7">Transcripts and video cache</text>
  <text x="256" y="267" font-size="12" fill="#a1a1aa">local Whisper runs here too</text>

  <!-- services -->
  <g font-size="14" font-weight="600" fill="#fafafa">
    <rect x="652" y="58" width="200" height="46" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="668" y="86">TUWEL</text>
    <rect x="652" y="116" width="200" height="46" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="668" y="144">LectureTube</text>
    <rect x="652" y="174" width="200" height="46" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="668" y="202">TU Wien login</text>
    <rect x="652" y="240" width="200" height="54" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <text x="668" y="263">Groq <tspan font-weight="400" font-size="12" fill="#a1a1aa">optional</tspan></text>
    <text x="668" y="282" font-size="12" font-weight="400" fill="#a1a1aa">audio only, with your key</text>
  </g>

  <!-- connections -->
  <g stroke="#a1a1aa" stroke-width="1.5" fill="none">
    <path d="M180 152 H222" marker-start="url(#head)" marker-end="url(#head)"/>
    <path d="M554 125 C600 125 610 81 650 81" marker-end="url(#head)"/>
    <path d="M554 125 C600 125 610 139 650 139" marker-end="url(#head)"/>
    <path d="M554 193 C600 193 610 197 650 197" marker-end="url(#head)"/>
    <path d="M554 253 C600 253 610 267 650 267" marker-end="url(#head)" stroke-dasharray="4 4"/>
  </g>
  <text x="201" y="142" text-anchor="middle" font-size="11" fill="#a1a1aa">MCP</text>
  <circle class="flow both" r="3.5" fill="#d946ef" style="offset-path: path('M180 152 H222'); animation-delay: 0s"/>
  <circle class="flow" r="3.5" fill="#ff3d71" style="offset-path: path('M554 125 C600 125 610 81 650 81'); animation-delay: 0s"/>
  <circle class="flow" r="3.5" fill="#d946ef" style="offset-path: path('M554 125 C600 125 610 139 650 139'); animation-delay: 0.8s"/>
  <circle class="flow" r="3.5" fill="#a855f7" style="offset-path: path('M554 193 C600 193 610 197 650 197'); animation-delay: 1.6s"/>
  <circle class="flow opt" r="3.5" fill="#6366f1" style="offset-path: path('M554 253 C600 253 610 267 650 267'); animation-delay: 0.4s"/>
</svg>
