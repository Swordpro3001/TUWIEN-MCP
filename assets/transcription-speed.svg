<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .label { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 12px; }
    .value { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .track { fill: #eaeef2; }
    .title { fill: #59636e; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .label, .value { fill: #e6edf3; }
      .sub, .title { fill: #9198a1; }
      .track { fill: #21262d; }
    }
  </style>
  <text class="title" x="10" y="22">Time to transcribe one hour of lecture audio (shorter is better)</text>

  <text class="label" x="10" y="66">Cloud</text>
  <text class="sub" x="10" y="84">Groq whisper-large-v3-turbo</text>
  <rect class="track" x="230" y="54" width="520" height="26" rx="6"/>
  <rect x="230" y="54" width="25" height="26" rx="6" fill="#1a7f37"/>
  <text class="value" x="265" y="73">under 20 s</text>

  <text class="label" x="10" y="126">Local</text>
  <text class="sub" x="10" y="144">bundled Whisper small, laptop CPU</text>
  <rect class="track" x="230" y="114" width="520" height="26" rx="6"/>
  <rect x="230" y="114" width="520" height="26" rx="6" fill="#0a7ab8"/>
  <text class="value" x="760" y="133">~7 min</text>
</svg>
