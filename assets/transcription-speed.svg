<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow ease-out both; }
    .cloud { animation-duration: 0.5s; animation-delay: 0.4s; }
    .local { animation-duration: 3s; animation-delay: 0.4s; animation-timing-function: linear; }
    .label { animation: fade 0.4s ease-out both; }
    .cloud-label { animation-delay: 0.9s; }
    .local-label { animation-delay: 3.4s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3d71"/><stop offset="0.45" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e11d74" stop-opacity="0.55"/><stop offset="1" stop-color="#e11d74" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
    <clipPath id="frame"><rect width="880" height="230" rx="20"/></clipPath></defs>
  <g clip-path="url(#frame)"><rect width="880" height="230" fill="#0b0b12"/><rect width="880" height="230" fill="url(#grid)"/><ellipse cx="820" cy="230" rx="300" ry="150" fill="url(#glowB)"/><ellipse cx="60" cy="0" rx="260" ry="130" fill="url(#glowA)"/></g><rect x="0.5" y="0.5" width="879" height="229" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="28" y="40" font-size="12" font-weight="600" letter-spacing="1.5" fill="#d946ef">TIME TO TRANSCRIBE ONE HOUR OF AUDIO</text>
  <text x="28" y="96" font-size="16" font-weight="600" fill="#fafafa">Cloud</text>
  <text x="28" y="116" font-size="12" fill="#a1a1aa">Groq whisper-large-v3-turbo</text>
  <rect x="250" y="84" width="500" height="28" rx="14" fill="#ffffff" fill-opacity="0.06"/>
  <rect class="bar cloud" x="250" y="84" width="28" height="28" rx="14" fill="url(#accent)"/>
  <text class="label cloud-label" x="772" y="104" font-size="15" font-weight="700" fill="url(#accent)">under 20 s</text>
  <text x="28" y="166" font-size="16" font-weight="600" fill="#fafafa">Local</text>
  <text x="28" y="186" font-size="12" fill="#a1a1aa">bundled Whisper small, laptop CPU</text>
  <rect x="250" y="154" width="500" height="28" rx="14" fill="#ffffff" fill-opacity="0.06"/>
  <rect class="bar local" x="250" y="154" width="500" height="28" rx="14" fill="#3f3f46"/>
  <text class="label local-label" x="766" y="174" font-size="15" font-weight="700" fill="#d4d4d8">~7 min</text>
</svg>
