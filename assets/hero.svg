    <rect x="574" y="200" width="236" height="88" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="692" y="240" font-size="28" font-weight="700" fill="url(#accent)">39 tools</text>
