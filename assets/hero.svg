    <text x="440" y="198" font-size="30" font-weight="700" fill="#ffffff">1 login</text>
    <text x="440" y="226">for TUWEL and LectureTube</text>
    <rect x="584" y="152" width="236" height="108" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <text x="702" y="198" font-size="30" font-weight="700" fill="#ffffff">40 tools</text>
    <text x="702" y="226">files, deadlines, grades, recordings</text>
