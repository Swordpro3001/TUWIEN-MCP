<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .num { fill: #0a7ab8; }
    .title { fill: #1f2328; font-weight: 600; font-size: 15px; }
    .text { fill: #59636e; font-size: 13px; }
    .arrow { stroke: #8c959f; }
    .note { fill: #59636e; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .num { fill: #4aa8de; }
      .title { fill: #e6edf3; }
      .text, .note { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <g>
    <rect class="card" x="10" y="20" width="190" height="160" rx="12"/>
    <circle class="num" cx="40" cy="50" r="15"/><text x="40" y="55" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">1</text>
    <text class="title" x="26" y="92">Claude calls login</text>
    <text class="text" x="26" y="116">when a tool needs it</text>
    <text class="text" x="26" y="134">or you ask for it</text>

    <rect class="card" x="230" y="20" width="190" height="160" rx="12"/>
    <circle class="num" cx="260" cy="50" r="15"/><text x="260" y="55" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text>
    <text class="title" x="246" y="92">Browser opens</text>
    <text class="text" x="246" y="116">your default browser,</text>
    <text class="text" x="246" y="134">separate profile, at the</text>
    <text class="text" x="246" y="152">real TU Wien login page</text>

    <rect class="card" x="450" y="20" width="190" height="160" rx="12"/>
    <circle class="num" cx="480" cy="50" r="15"/><text x="480" y="55" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">3</text>
    <text class="title" x="466" y="92">You sign in</text>
    <text class="text" x="466" y="116">as usual, including 2FA;</text>
    <text class="text" x="466" y="134">the server never sees</text>
    <text class="text" x="466" y="152">your password</text>

    <rect class="card" x="670" y="20" width="200" height="160" rx="12"/>
    <circle class="num" cx="700" cy="50" r="15"/><text x="700" y="55" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">4</text>
    <text class="title" x="686" y="92">Session is stored</text>
    <text class="text" x="686" y="116">signed in to TUWEL,</text>
    <text class="text" x="686" y="134">LectureTube and Opencast;</text>
    <text class="text" x="686" y="152">the window closes</text>
  </g>
  <g class="arrow" stroke-width="2" marker-end="url(#head)">
    <line x1="203" y1="100" x2="226" y2="100"/>
    <line x1="423" y1="100" x2="446" y2="100"/>
    <line x1="643" y1="100" x2="666" y2="100"/>
  </g>
  <text class="note" x="440" y="222" text-anchor="middle">Later logins run silently in the background while your TU Wien session is valid.</text>
</svg>
