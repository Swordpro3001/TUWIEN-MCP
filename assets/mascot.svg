<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d71"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a21caf"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="120" cy="222" rx="58" ry="7" fill="#000" opacity="0.15"/>

  <!-- ear tufts -->
  <path d="M72 70 L64 34 L98 58 Z" fill="#d946ef"/>
  <path d="M168 70 L176 34 L142 58 Z" fill="#a855f7"/>

  <!-- body -->
  <path d="M120 44 C170 44 190 86 190 130 C190 182 160 214 120 214 C80 214 50 182 50 130 C50 86 70 44 120 44 Z" fill="url(#body)"/>

  <!-- wings -->
  <path d="M54 118 C34 140 38 180 66 196 C62 170 64 142 74 124 Z" fill="url(#wing)"/>
  <path d="M186 118 C206 140 202 180 174 196 C178 170 176 142 166 124 Z" fill="url(#wing)"/>

  <!-- belly -->
  <ellipse cx="120" cy="164" rx="40" ry="42" fill="#ffffff" opacity="0.18"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
    <path d="M104 150 l6 6 l6 -6"/><path d="M124 150 l6 6 l6 -6"/>
    <path d="M114 170 l6 6 l6 -6"/>
    <path d="M104 188 l6 6 l6 -6"/><path d="M124 188 l6 6 l6 -6"/>
  </g>

  <!-- headphones -->
  <path d="M60 104 C60 56 180 56 180 104" fill="none" stroke="#a1a1aa" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
  <path d="M60 104 C60 56 180 56 180 104" fill="none" stroke="#18181b" stroke-width="9" stroke-linecap="round"/>
  <rect x="44" y="92" width="24" height="40" rx="11" fill="#18181b" stroke="#a1a1aa" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <rect x="172" y="92" width="24" height="40" rx="11" fill="#18181b" stroke="#a1a1aa" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <rect x="50" y="100" width="10" height="24" rx="5" fill="#ff3d71"/>
  <rect x="180" y="100" width="10" height="24" rx="5" fill="#6366f1"/>

  <!-- eyes -->
  <circle cx="96" cy="104" r="25" fill="#ffffff"/>
  <circle cx="144" cy="104" r="25" fill="#ffffff"/>
  <circle cx="100" cy="106" r="12" fill="#18181b"/>
  <circle cx="140" cy="106" r="12" fill="#18181b"/>
  <circle cx="104" cy="101" r="4" fill="#ffffff"/>
  <circle cx="144" cy="101" r="4" fill="#ffffff"/>

  <!-- beak -->
  <path d="M120 122 L111 131 L120 142 L129 131 Z" fill="#fbbf24"/>

  <!-- feet -->
  <g fill="#fbbf24">
    <rect x="96" y="208" width="16" height="10" rx="5"/>
    <rect x="128" y="208" width="16" height="10" rx="5"/>
  </g>

  <!-- graduation cap -->
  <path d="M120 22 L168 40 L120 58 L72 40 Z" fill="#18181b" stroke="#a1a1aa" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <path d="M94 49 L94 62 C108 70 132 70 146 62 L146 49 L120 58 Z" fill="#27272a" stroke="#a1a1aa" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="120" cy="40" r="4" fill="#fbbf24"/>
  <path d="M120 40 L156 52 L156 72" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 70 L156 84 L160 70 Z" fill="#fbbf24"/>
</svg>
