name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (empty = derive from conventional commits)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: bump
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMPED: ${{ steps.bump.outputs.content }}
        run: |
          v="${INPUT_VERSION:-$BUMPED}"
          v="$(echo "$v" | tr -d '[:space:]')"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$v'" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v already exists" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }} --unreleased --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build jars
        run: ./gradlew allJars -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Commit changelog and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The plugin launcher downloads the release jars matching this version.
          sed -i -E "s/(\"version\": *\")[^\"]+/\1$VERSION/" .claude-plugin/plugin.json
          git add CHANGELOG.md .claude-plugin/plugin.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            build/libs/tuwel-mcp.jar
            build/libs/lecturetube-mcp.jar
