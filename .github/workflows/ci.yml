name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Superseded pull request runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: ./gradlew test allJars

      - name: Coverage
        if: github.event_name == 'push'
        run: ./gradlew koverHtmlReport koverXmlReport

      - name: Upload test reports
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests/test

      # Reports go to GitHub Pages so the README badges can link to them; artifacts are zip downloads.
      - name: Build report site
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          mkdir -p site
          cp -r build/reports/tests/test site/tests
          if [ -d build/reports/kover/html ]; then cp -r build/reports/kover/html site/coverage; fi
          python3 - <<'PY'
          import glob, json, os, xml.etree.ElementTree as ET
          def badge(name, label, message, color):
              json.dump({"schemaVersion": 1, "label": label, "message": message, "color": color}, open(f"site/{name}.json", "w"))
          tests = failed = 0
          for f in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests")); failed += int(r.get("failures")) + int(r.get("errors"))
          badge("tests", "tests", f"{failed} failed" if failed else f"{tests} passed", "red" if failed else "brightgreen")
          if os.path.exists("build/reports/kover/report.xml"):
              c = next(c for c in ET.parse("build/reports/kover/report.xml").getroot().findall("counter") if c.get("type") == "LINE")
              pct = 100 * int(c.get("covered")) / (int(c.get("covered")) + int(c.get("missed")))
              badge("coverage", "coverage", f"{pct:.1f}%", "brightgreen" if pct >= 80 else "yellow" if pct >= 50 else "orange")
          PY
          echo '<!doctype html><title>TU Wien for Claude: reports</title><h1>Reports of the latest run on main</h1><ul><li><a href="tests/">Tests</a></li><li><a href="coverage/">Coverage</a></li></ul>' > site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: site

  # Paths, .exe lookups and process handling differ on Windows; the Linux job alone wouldn't catch those.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Test
        run: ./gradlew.bat test allJars

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows
          path: build/reports/tests/test

  reports:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
